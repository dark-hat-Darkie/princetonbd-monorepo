# Local development database.
#
# Neon is the deployed target, but a throwaway local Postgres keeps the inner
# loop fast and lets e2e tests run without touching a shared branch. Port 55432
# avoids colliding with any Postgres already running on the host's 5432.
services:
  postgres:
    image: postgres:18-alpine
    container_name: princetonbd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: princetonbd
      POSTGRES_PASSWORD: princetonbd
      POSTGRES_DB: princetonbd
    ports:
      - '55432:5432'
    volumes:
      # Postgres 18 images expect a single mount at /var/lib/postgresql (data
      # then lives in a version-named subdirectory), not the pre-18
      # /var/lib/postgresql/data. Mounting the old path makes the container
      # refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U princetonbd -d princetonbd']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for admin uploads (course thumbnails, teacher
  # photos). The API presigns PUT URLs against it and the browser uploads
  # directly; in production this is Cloudflare R2 or AWS S3 with the same
  # env block. Console at http://localhost:9001 (user/password below).
  # Pulled from quay.io: MinIO no longer publishes to Docker Hub.
  minio:
    image: quay.io/minio/minio
    container_name: princetonbd-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: princetonbd
      MINIO_ROOT_PASSWORD: princetonbd-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket and makes its objects publicly readable, so
  # `S3_PUBLIC_URL=http://localhost:9000/princetonbd-media` serves them.
  minio-init:
    image: quay.io/minio/mc
    container_name: princetonbd-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 princetonbd princetonbd-secret &&
        mc mb --ignore-existing local/princetonbd-media &&
        mc anonymous set download local/princetonbd-media
      "

volumes:
  postgres-data:
  minio-data:
